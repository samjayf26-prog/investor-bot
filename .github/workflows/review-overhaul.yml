name: review-overhaul

# Independent review of the profit-overhaul evidence. Market data only; places no orders and
# touches no bot code. Runs on the review branch only and commits the data and results back to it.
on:
  push:
    branches: [claude/project-thread-cg2w6f]
    paths: ["review/overhaul/**", ".github/workflows/review-overhaul.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: review-overhaul
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q "yfinance>=0.2.50" pandas numpy requests
      - name: Fetch data
        run: python review/overhaul/fetch_data.py
      - name: Verify
        run: |
          python review/overhaul/verify_core.py && cat review/overhaul/verify-results.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Save data and results
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add review/overhaul/data review/overhaul/verify-results.md || true
          git diff --cached --quiet && exit 0
          git commit -m "review: overhaul data and results $(date -u +%FT%H:%MZ)"
          for wait in 5 10 20; do
            git pull --rebase --autostash -X theirs origin claude/project-thread-cg2w6f && git push -q origin HEAD:claude/project-thread-cg2w6f && exit 0
            git rebase --abort 2>/dev/null || true
            sleep "$wait"
          done
          exit 1
