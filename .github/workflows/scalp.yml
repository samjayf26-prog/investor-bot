name: scalp

on:
  # Retired 2026-10-30 (profit overhaul): 70 sessions of replays found no setting that
  # made money after costs, so the paper scalper no longer runs on a schedule. Run it by
  # hand from the Actions tab if you want to watch it; it only ever touches the paper account.
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes to scalp, starting now"
        default: "30"

concurrency:
  group: scalper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scalp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scalp
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_LIVE_KEY_ID: ${{ secrets.ALPACA_LIVE_KEY_ID }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
          SCALP_START_NOW: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          SCALP_MINUTES: ${{ inputs.minutes }}
        run: |
          git pull -q origin main
          python -m bot.scalper
      - name: Save scalp log
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add ledger/ || true
          git diff --cached --quiet && exit 0
          git commit -m "scalps $(date -u +%FT%H:%MZ)"
          for wait in 5 10 20 40 60; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            echo "save failed; retrying in ${wait}s"; sleep "$wait"
          done
          exit 1
