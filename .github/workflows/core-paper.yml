name: core-paper

on:
  schedule:
    # 19:36 and 20:36 UTC: one lands at 15:36 ET in either daylight-saving season, inside
    # the core's 15:35-15:58 rebalance window; the other is outside it and does nothing.
    - cron: "36 19,20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: core-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rehearse the leveraged core on the paper account
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: python -m bot.core paper
      - name: Save the rehearsal state and ledger
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add state/paper_core.json ledger/paper_core.csv 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "core rehearsal $(date -u +%FT%H:%MZ)"
          for wait in 5 10 20 40 60; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            echo "save failed; retrying in ${wait}s"; sleep "$wait"
          done
          exit 1
