name: trade

on:
  schedule:
    # GitHub cron is UTC. Two entries cover both daylight-saving seasons; the bot
    # exits at once from whichever one lands too early. Main run: ~15:07 ET.
    - cron: "7 19 * * 1-5"
    - cron: "7 20 * * 1-5"
    # Backstop: ~09:47 ET, closes anything left open overnight.
    - cron: "47 13 * * 1-5"
    - cron: "47 14 * * 1-5"
  workflow_dispatch:
    inputs:
      command:
        description: "day, flatten or status"
        default: status

concurrency:
  group: trading
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick command
        id: cmd
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_COMMAND: ${{ inputs.command }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_COMMAND" in day|flatten|status) echo "command=$INPUT_COMMAND" >> "$GITHUB_OUTPUT" ;; *) exit 1 ;; esac
          elif [ "$SCHEDULE" = "47 13 * * 1-5" ] || [ "$SCHEDULE" = "47 14 * * 1-5" ]; then
            echo "command=backstop" >> "$GITHUB_OUTPUT"
          else
            echo "command=day" >> "$GITHUB_OUTPUT"
          fi
      - name: Run bot
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_LIVE_KEY_ID: ${{ secrets.ALPACA_LIVE_KEY_ID }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
        run: python -m bot.trader "${{ steps.cmd.outputs.command }}"
      - name: Save trade log
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add ledger/ || true
          git diff --cached --quiet || (git commit -m "ledger: $(date -u +%F)" && git push)
