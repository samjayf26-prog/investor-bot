name: trade

on:
  schedule:
    # GitHub cron is UTC: :50 past each hour, 13:50-20:50 UTC, covers 9:50-15:50 ET in both
    # daylight-saving seasons. The bot exits at once when the market is closed.
    - cron: "50 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      command:
        description: "cycle, flatten or status"
        default: status

concurrency:
  group: trading
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick command
        id: cmd
        env:
          EVENT: ${{ github.event_name }}
          INPUT_COMMAND: ${{ inputs.command }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_COMMAND" in cycle|flatten|status) echo "command=$INPUT_COMMAND" >> "$GITHUB_OUTPUT" ;; *) exit 1 ;; esac
          else
            echo "command=cycle" >> "$GITHUB_OUTPUT"
          fi
      - name: Run bot
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_LIVE_KEY_ID: ${{ secrets.ALPACA_LIVE_KEY_ID }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
        run: python -m bot.trader "${{ steps.cmd.outputs.command }}"
      - name: Save state and trade log
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add ledger/ state/ || true
          git diff --cached --quiet && exit 0
          git commit -m "bot state $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
