name: trade

on:
  schedule:
    # GitHub cron is UTC: every 15 minutes, 13:05-20:50 UTC, covers market hours in both
    # daylight-saving seasons, so stops and targets are checked 4 times an hour.
    # The bot exits at once when the market is closed.
    - cron: "5,20,35,50 13-20 * * 1-5"
  push:
    # Act on new research picks (and close requests) as soon as Claude pushes them.
    # The bot's own commits never touch this file, so this cannot loop.
    branches: [main]
    paths: [picks/latest.json]
  workflow_dispatch:
    inputs:
      command:
        description: "cycle, flatten or status"
        default: status

concurrency:
  group: trading
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick command
        id: cmd
        env:
          EVENT: ${{ github.event_name }}
          INPUT_COMMAND: ${{ inputs.command }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$INPUT_COMMAND" in cycle|flatten|status) echo "command=$INPUT_COMMAND" >> "$GITHUB_OUTPUT" ;; *) exit 1 ;; esac
          else
            echo "command=cycle" >> "$GITHUB_OUTPUT"
          fi
      - name: Run bot
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_LIVE_KEY_ID: ${{ secrets.ALPACA_LIVE_KEY_ID }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
        run: python -m bot.trader "${{ steps.cmd.outputs.command }}"
      - name: Save state and trade log
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add ledger/ state/ || true
          git diff --cached --quiet && exit 0
          git commit -m "bot state $(date -u +%FT%H:%MZ)"
          # Retry with backoff; a failed rebase is aborted so the next try starts clean, and on a
          # clash in state/ or ledger/ this run's newer files win (-X theirs, in rebase terms).
          for wait in 5 10 20 40 60; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            echo "save failed; retrying in ${wait}s"; git status --short | head -20
            sleep "$wait"
          done
          exit 1
