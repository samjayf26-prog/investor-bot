name: scan

on:
  schedule:
    # Hourly news-gap scan at :50. UTC cron covering 10:50-14:50 ET in both daylight-saving
    # seasons; bot/scan.py skips runs outside 10:30-15:30 ET. The build thread also dispatches
    # it by hand because GitHub's cron is unreliable.
    - cron: "50 14-19 * * 1-5"
  workflow_dispatch:

concurrency:
  group: trading
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Scan the news, then trade on the result
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_LIVE_KEY_ID: ${{ secrets.ALPACA_LIVE_KEY_ID }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # A push made by this job does not start trade.yml (GitHub ignores workflow pushes),
          # so the trade cycle runs here when the scan changed the picks.
          python -m bot.scan | tee scan.out
          if grep -q SCAN_CHANGED=1 scan.out; then python -m bot.trader cycle; fi
      - name: Save picks, journal, state and ledgers
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add picks/ research/journal.md ledger/ state/ || true
          git diff --cached --quiet && exit 0
          git commit -m "scan $(date -u +%FT%H:%MZ)"
          for wait in 5 10 20 40 60; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $wait
          done
          exit 1
