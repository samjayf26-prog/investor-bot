name: learn

on:
  schedule:
    # 20:15 and 21:15 UTC cover 4:15pm ET in both daylight-saving seasons; the
    # second run sees today's update and stops.
    - cron: "15 20,21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: learn
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Score the day and tune the scalper
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          ALPACA_LIVE_KEY_ID: ${{ secrets.ALPACA_LIVE_KEY_ID }}
          ALPACA_LIVE_SECRET: ${{ secrets.ALPACA_LIVE_SECRET }}
        run: python -m bot.learn
      - name: Save what it learned
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add tuning.json research/
          git diff --cached --quiet && exit 0
          git commit -m "learn $(date -u +%F)"
          for wait in 5 10 20 40 60; do
            git pull --rebase --autostash -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            echo "save failed; retrying in ${wait}s"; sleep "$wait"
          done
          exit 1
