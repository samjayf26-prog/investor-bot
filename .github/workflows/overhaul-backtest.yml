name: overhaul-backtest

# Profit-overhaul research: real-data backtests for the redesign. Market data only (Yahoo/Stooq,
# and Alpaca paper keys for data), places no orders, touches no bot code. Runs on this research
# branch only and commits research/overhaul/results.md back to it.
on:
  push:
    branches: [claude/project-thread-kx8rhp]
    paths: ["research/overhaul/**", ".github/workflows/overhaul-backtest.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: overhaul-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -q "yfinance>=0.2.50" pandas numpy requests
      - name: Backtest
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: |
          python research/overhaul/overhaul_backtest.py
          cat research/overhaul/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save results
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add research/overhaul/results.md research/overhaul/yearly.csv || true
          git diff --cached --quiet && exit 0
          git commit -m "overhaul: backtest results $(date -u +%FT%H:%MZ)"
          for wait in 5 10 20; do
            git pull --rebase --autostash -X theirs origin claude/project-thread-kx8rhp && git push -q origin HEAD:claude/project-thread-kx8rhp && exit 0
            git rebase --abort 2>/dev/null || true
            sleep "$wait"
          done
          exit 1
